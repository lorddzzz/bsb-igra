# Slower checks that run next to the deploy without holding it up: every game played end to end
# in a real browser on simulated phones, and the database rules on the Firebase emulator.
# A red mark here means something to look at before the next trip, not a broken site.
name: Full checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: sh e2e/all.sh
        env:
          OUT: e2e/shots-ci
      - name: iPhone SE sized screens
        run: sh e2e/all.sh
        env:
          OUT: e2e/shots-ci-se
          WIDTH: 375
          HEIGHT: 667
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/shots-ci*
          retention-days: 7

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
