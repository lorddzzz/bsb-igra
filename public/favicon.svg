<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Družina: a comic burst with a bold "D" on a night-blue halftone square, ink outlines and a hard shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3160"/>
      <stop offset="1" stop-color="#171a2e"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5" fill="#ffffff" fill-opacity=".10"/>
    </pattern>
    <polygon id="burst" points="0,-330 70,-200 210,-255 190,-110 330,-60 230,40 320,160 170,160 170,310 50,230 -40,330 -100,200 -250,250 -220,110 -340,50 -230,-50 -300,-180 -160,-160 -170,-300 -50,-220"/>
    <path id="D" d="M-120,-170 L-120,170 L10,170 C130,170 190,110 190,0 C190,-110 130,-170 10,-170 Z M-30,-85 L10,-85 C75,-85 100,-55 100,0 C100,55 75,85 10,85 L-30,85 Z" fill-rule="evenodd"/>
    <clipPath id="square">
      <rect width="1024" height="1024" rx="0"/>
    </clipPath>
  </defs>
  <g clip-path="url(#square)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#dots)"/>
    <!-- rays -->
    <g fill="#ffd60a" fill-opacity=".12" transform="translate(512 512)">
      <polygon points="0,0 -90,-900 90,-900"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(30)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(60)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(90)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(120)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(150)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(180)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(210)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(240)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(270)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(300)"/>
      <polygon points="0,0 -90,-900 90,-900" transform="rotate(330)"/>
    </g>
    <!-- burst: hard shadow, red burst, yellow burst -->
    <g transform="translate(512 512) rotate(-8) scale(1.25)">
      <use href="#burst" fill="#0b0c14" transform="translate(26 26)"/>
      <use href="#burst" fill="#ff3d5a" stroke="#0b0c14" stroke-width="22" stroke-linejoin="round"/>
      <use href="#burst" fill="#ffd60a" stroke="#0b0c14" stroke-width="18" stroke-linejoin="round" transform="scale(.8)"/>
    </g>
    <!-- the letter D, drawn as a path so no font is needed -->
    <g transform="translate(512 512)">
      <use href="#D" fill="#0b0c14" transform="translate(14 14)"/>
      <use href="#D" fill="#f4f1ff" stroke="#0b0c14" stroke-width="20" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
